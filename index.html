<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiveCoach — Coaching commercial en temps réel</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233B6B50'/%3E%3Cpath d='M50 22a12 12 0 0 0-12 12v20a12 12 0 0 0 24 0V34a12 12 0 0 0-12-12z' fill='white'/%3E%3Cpath d='M74 48v4a24 24 0 0 1-48 0v-4' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3Cline x1='50' y1='76' x2='50' y2='86' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --stone-50:#FAFAF9;--stone-100:#F2F1EF;--stone-200:#E8E6E3;--white:#FFFFFF;
  --sage:#3B6B50;--sage-mid:#4E8A68;--sage-light:#EEF5F1;--sage-border:#C4DDD0;
  --ink:#18181B;--ink-2:#3F3F46;--muted:#71717A;--muted-2:#A1A1AA;
  --border:#E4E4E7;--border-2:#D4D4D8;
  --amber:#B45309;--amber-bg:#FFFBEB;--amber-border:#FDE68A;
  --red:#B91C1C;--red-bg:#FEF2F2;--blue:#1D4ED8;--blue-bg:#EFF6FF;
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:16px;
  --shadow-xs:0 1px 2px rgba(24,24,27,0.04);
  --shadow-sm:0 1px 3px rgba(24,24,27,0.06),0 1px 2px rgba(24,24,27,0.04);
  --shadow-md:0 4px 16px rgba(24,24,27,0.07),0 2px 4px rgba(24,24,27,0.04);
  --shadow-lg:0 12px 40px rgba(24,24,27,0.10);
  --ease:cubic-bezier(.4,0,.2,1);--t-fast:120ms;--t-mid:220ms;--topbar-h:56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
html{font-size:14px;-webkit-font-smoothing:antialiased;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--stone-50);color:var(--ink);line-height:1.5;}
button,input,textarea,select{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
input,textarea,select{outline:none;border:none;background:none;}
a{color:inherit;text-decoration:none;}
::placeholder{color:var(--muted-2);}
.scrollable{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--border-2) transparent;}
.scrollable::-webkit-scrollbar{width:6px;}
.scrollable::-webkit-scrollbar-track{background:transparent;}
.scrollable::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px;}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--stone-50);}
.view{display:none;flex:1;overflow:hidden;}
.view.active{display:flex;}
.topbar{height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;}
.topbar-brand{display:flex;align-items:center;gap:9px;margin-right:20px;flex-shrink:0;}
.topbar-logo{width:28px;height:28px;background:var(--sage);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.topbar-logo svg{width:16px;height:16px;}
.topbar-name{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
.topbar-name span{color:var(--sage);font-style:normal;}
.topbar-nav{display:flex;gap:2px;flex:1;}
.nav-btn{padding:7px 14px;border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--muted);transition:color var(--t-fast),background var(--t-fast);}
.nav-btn:hover{background:var(--stone-100);color:var(--ink);}
.nav-btn.active{background:var(--stone-100);color:var(--ink);font-weight:600;}
.topbar-spacer{flex:1;}
.btn-primary{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;background:var(--sage);color:#fff;border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;transition:background var(--t-fast),transform var(--t-fast);white-space:nowrap;}
.btn-primary:hover{background:var(--sage-mid);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--white);color:var(--ink-2);border:1px solid var(--border-2);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all var(--t-fast);white-space:nowrap;}
.btn-secondary:hover{background:var(--stone-100);border-color:var(--muted-2);}
.btn-secondary:active{transform:scale(.98);}
.btn-secondary:disabled{opacity:.5;cursor:wait;}
.btn-ghost{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--r-sm);color:var(--muted);font-size:12px;font-weight:500;transition:all var(--t-fast);}
.btn-ghost:hover{background:var(--stone-100);color:var(--ink);}
#view-prospects{flex-direction:column;}
.prospects-body{display:flex;flex:1;overflow:hidden;}
.prospects-list-panel{width:320px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--white);}
.panel-header{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.panel-title{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;flex:1;}
.search-input-wrap{padding:10px 12px;border-bottom:1px solid var(--border);}
.search-input{width:100%;background:var(--stone-50);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;color:var(--ink);transition:border-color var(--t-fast),box-shadow var(--t-fast);}
.search-input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(59,107,80,.10);}
.prospects-list{flex:1;}
.prospect-row{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--t-fast);display:flex;gap:10px;align-items:flex-start;}
.prospect-row:hover{background:var(--stone-50);}
.prospect-row.selected{background:var(--sage-light);border-left:2px solid var(--sage);}
.prospect-avatar{width:32px;height:32px;border-radius:var(--r-sm);background:var(--sage-light);border:1px solid var(--sage-border);display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;color:var(--sage);flex-shrink:0;}
.prospect-info{flex:1;min-width:0;}
.prospect-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prospect-company{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.prospect-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500;letter-spacing:.01em;}
.badge-neutral{background:var(--stone-100);color:var(--muted);}
.badge-success{background:var(--sage-light);color:var(--sage);}
.badge-warning{background:var(--amber-bg);color:var(--amber);}
.badge-info{background:var(--blue-bg);color:var(--blue);}
.prospect-detail-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.detail-topbar{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--white);}
.detail-prospect-name{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
.detail-body{flex:1;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start;}
.detail-body.single-col{grid-template-columns:1fr;}
.field-group{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-xs);}
.field-group.span2{grid-column:1/-1;}
.field-group-title{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.field-row{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:start;padding:6px 0;border-bottom:1px solid var(--border);}
.field-row:last-child{border-bottom:none;}
.field-label{font-size:12px;color:var(--muted);padding-top:2px;}
.field-value{font-size:13px;color:var(--ink);line-height:1.5;word-break:break-word;}
.rdv-history-panel{width:280px;flex-shrink:0;border-left:1px solid var(--border);background:var(--white);display:flex;flex-direction:column;}
.rdv-entry{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--t-fast);}
.rdv-entry:hover{background:var(--stone-50);}
.rdv-date{font-size:11px;color:var(--muted-2);font-weight:500;}
.rdv-label{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;margin-top:3px;color:var(--ink);}
.rdv-summary{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);padding:24px;}
.empty-icon{opacity:.35;}
.empty-title{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:var(--ink-2);}
.empty-sub{font-size:13px;text-align:center;max-width:280px;line-height:1.5;}
#view-setup{flex-direction:column;background:var(--stone-50);}
.wizard-topbar{height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:20px;flex-shrink:0;}
.wizard-title{font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
.wizard-steps{display:flex;align-items:center;gap:0;flex:1;justify-content:center;}
.wstep{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:var(--r-sm);transition:background var(--t-fast);}
.wstep-num{width:22px;height:22px;border-radius:50%;background:var(--stone-100);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;transition:all var(--t-fast);}
.wstep-label{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;}
.wstep.active .wstep-num{background:var(--sage);border-color:var(--sage);color:#fff;}
.wstep.active .wstep-label{color:var(--ink);font-weight:600;}
.wstep.done .wstep-num{background:var(--sage-light);border-color:var(--sage-border);color:var(--sage);}
.wstep.done .wstep-label{color:var(--ink-2);}
.wstep-sep{width:24px;height:1px;background:var(--border);}
.wizard-body{flex:1;overflow:hidden;display:flex;}
.wizard-content{flex:1;padding:36px 32px;overflow-y:auto;max-width:820px;margin:0 auto;width:100%;}
.wizard-panel{display:none;}
.wizard-panel.active{display:block;animation:fadeIn var(--t-mid) var(--ease);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.w-section-title{font-family:'DM Sans',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--ink);margin-bottom:6px;}
.w-section-sub{font-size:13px;color:var(--muted);margin-bottom:26px;line-height:1.55;}
.w-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:16px;box-shadow:var(--shadow-xs);}
.w-card-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.w-card-title{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;color:var(--ink);}
.w-card-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}
.w-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.w-field{display:flex;flex-direction:column;gap:6px;}
.w-field.full{grid-column:1/-1;}
.w-label{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;}
.w-input{background:var(--white);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;color:var(--ink);transition:border-color var(--t-fast),box-shadow var(--t-fast);width:100%;}
.w-input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(59,107,80,.10);}
.w-textarea{resize:vertical;min-height:76px;line-height:1.55;font-family:inherit;}
.url-row{display:flex;gap:8px;}
.url-row .w-input{flex:1;}
.btn-fetch{padding:9px 16px;border-radius:var(--r-sm);background:var(--stone-100);border:1px solid var(--border-2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:all var(--t-fast);}
.btn-fetch:hover{border-color:var(--sage);color:var(--sage);background:var(--sage-light);}
.btn-fetch:disabled{opacity:.5;cursor:wait;}
.fetch-loading{display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px;}
.fetch-loading.visible{display:flex;}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--sage);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.sequence-selector{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.seq-btn{padding:14px 10px;border-radius:var(--r-lg);background:var(--white);border:1.5px solid var(--border-2);cursor:pointer;transition:all var(--t-fast);text-align:center;}
.seq-btn:hover{border-color:var(--sage-border);background:var(--sage-light);}
.seq-btn.selected{border-color:var(--sage);background:var(--sage-light);}
.seq-btn.selected .seq-label{color:var(--sage);}
.seq-icon{font-size:22px;margin-bottom:6px;}
.seq-label{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
.seq-desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3;}
.script-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.btn-ai-script{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r-sm);background:var(--sage-light);border:1px solid var(--sage-border);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--sage);cursor:pointer;transition:all var(--t-fast);}
.btn-ai-script:hover{background:var(--sage);color:#fff;border-color:var(--sage);}
.btn-ai-script:disabled{opacity:.5;cursor:wait;}
.angles-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px;}
.angle-card{background:var(--white);border:1.5px solid var(--border-2);border-radius:var(--r-lg);padding:16px;cursor:pointer;transition:all var(--t-fast);position:relative;}
.angle-card:hover{border-color:var(--sage-border);background:var(--sage-light);}
.angle-card.selected{border-color:var(--sage);background:var(--sage-light);}
.angle-card.selected .angle-num{background:var(--sage);color:#fff;}
.angle-num{width:26px;height:26px;border-radius:50%;background:var(--stone-100);display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:10px;transition:all var(--t-fast);}
.angle-mechanism{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--sage);text-transform:uppercase;margin-bottom:4px;}
.angle-title{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;margin-bottom:6px;color:var(--ink);}
.angle-desc{font-size:12px;color:var(--muted);line-height:1.55;}
.angle-key-stat{margin-top:10px;padding:6px 10px;background:var(--stone-100);border-radius:var(--r-xs);font-size:11px;color:var(--ink-2);font-weight:500;}
.angle-check{display:none;margin-top:10px;font-size:11px;font-weight:700;color:var(--sage);letter-spacing:.02em;}
.angle-card.selected .angle-check{display:block;}
.upload-zone{border:1.5px dashed var(--border-2);border-radius:var(--r-lg);padding:32px;text-align:center;cursor:pointer;transition:all var(--t-mid);background:var(--stone-50);}
.upload-zone:hover{border-color:var(--sage);background:var(--sage-light);}
.upload-zone.has-file{border-color:var(--sage);border-style:solid;background:var(--sage-light);}
.upload-icon{font-size:28px;margin-bottom:8px;opacity:.5;}
.upload-label{font-size:13px;color:var(--ink-2);font-weight:500;}
.upload-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.wizard-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--white);flex-shrink:0;}
.wizard-footer-left{font-size:12px;color:var(--muted-2);}
#view-live{flex-direction:column;background:var(--stone-50);}
.live-topbar{height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;}
.live-indicator{display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--red-bg);border:1px solid rgba(185,28,28,.20);border-radius:99px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;color:var(--red);letter-spacing:.05em;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse-red 1.4s infinite;}
@keyframes pulse-red{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);}}
.live-timer{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:52px;}
.phase-pills{display:flex;gap:2px;background:var(--stone-100);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;}
.phase-pill{padding:5px 13px;border-radius:var(--r-xs);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all var(--t-fast);white-space:nowrap;}
.phase-pill:hover{color:var(--ink-2);}
.phase-pill.active{background:var(--white);color:var(--ink);box-shadow:var(--shadow-xs);}
.debit-gauge{display:flex;align-items:center;gap:8px;}
.debit-label{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
.debit-track{width:80px;height:6px;background:var(--stone-200);border-radius:3px;overflow:hidden;}
.debit-fill{height:100%;border-radius:3px;transition:width .5s var(--ease),background .5s var(--ease);background:var(--sage);width:0%;}
.debit-wpm{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:48px;}
.quality-gauge{display:flex;align-items:center;gap:8px;}
.quality-label{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
.quality-dots{display:flex;gap:3px;}
.qdot{width:10px;height:10px;border-radius:50%;background:var(--stone-200);border:1px solid var(--border-2);transition:all var(--t-mid);}
.qdot.filled{background:var(--sage);border-color:var(--sage);}
.quality-pct{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:var(--ink-2);min-width:32px;}
.silence-alert{display:none;align-items:center;gap:6px;padding:5px 11px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;color:var(--amber);letter-spacing:.02em;animation:pulse-amber 1.5s infinite;}
.silence-alert.visible{display:flex;}
@keyframes pulse-amber{0%,100%{opacity:1;}50%{opacity:.7;}}
.audio-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--stone-100);border:1px solid var(--border-2);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all var(--t-fast);}
.audio-toggle:hover{background:var(--stone-200);}
.audio-toggle.on{background:var(--sage);color:#fff;border-color:var(--sage);}
.audio-toggle.on .audio-dot{background:#fff;animation:pulse-red 1.4s infinite;}
.audio-dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2);}
.live-body{flex:1;display:grid;grid-template-columns:300px 1fr 340px;overflow:hidden;}
.col-left{background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.col-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.col-title{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
.col-left-body{flex:1;}
.info-card{padding:12px 16px;border-bottom:1px solid var(--border);position:relative;transition:background var(--t-mid);}
.info-card.flash{background:var(--sage-light);}
.info-card-label{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.info-card-value{font-size:13px;color:var(--muted-2);line-height:1.5;font-style:italic;}
.info-card-value.filled{color:var(--ink-2);font-style:normal;}
.matching-panel{border-top:2px solid var(--sage-border);background:var(--sage-light);flex-shrink:0;}
.matching-panel .col-header{background:var(--white);}
.matching-body{max-height:280px;}
.matching-item{padding:12px 14px;border-bottom:1px solid var(--sage-border);display:flex;flex-direction:column;gap:6px;}
.matching-item:last-child{border-bottom:none;}
.matching-point{display:flex;flex-direction:column;gap:3px;}
.matching-type{font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;}
.matching-text{font-size:12px;color:var(--ink-2);line-height:1.45;}
.matching-arrow{color:var(--sage);font-size:14px;text-align:center;font-weight:700;}
.matching-benefit{padding:8px 10px;background:var(--white);border-radius:var(--r-sm);border-left:3px solid var(--sage);}
.matching-benefit-text{font-size:12px;color:var(--sage);line-height:1.5;font-weight:500;}
.col-center{display:flex;flex-direction:column;overflow:hidden;background:var(--stone-50);}
.transcript-zone{flex:1;padding:20px 24px;overflow-y:auto;}
.transcript-inner{display:flex;flex-direction:column;gap:12px;}
.turn{display:flex;gap:10px;align-items:flex-start;animation:fadeSlide .22s var(--ease);}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.turn-who{width:30px;height:30px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px;letter-spacing:.02em;}
.turn-who.commercial{background:var(--sage-light);color:var(--sage);border:1px solid var(--sage-border);}
.turn-who.prospect{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(29,78,216,.20);}
.turn-who.unknown{background:var(--stone-100);color:var(--muted);border:1px solid var(--border);}
.turn-bubble{flex:1;background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;line-height:1.55;color:var(--ink);box-shadow:var(--shadow-xs);}
.turn.commercial .turn-bubble{border-color:var(--sage-border);}
.turn-time{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--muted-2);margin-top:5px;font-variant-numeric:tabular-nums;}
.recap-zone{display:none;flex:1;flex-direction:column;overflow:hidden;}
.recap-zone.active{display:flex;}
.recap-body{flex:1;padding:20px 24px;overflow-y:auto;}
.recap-textarea{width:100%;min-height:260px;background:var(--white);border:1px solid var(--border-2);border-radius:var(--r-md);padding:14px 16px;font-size:13px;color:var(--ink);line-height:1.65;resize:vertical;transition:border-color var(--t-fast),box-shadow var(--t-fast);}
.recap-textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(59,107,80,.10);}
.recap-actions{padding:0 24px 20px;display:flex;gap:8px;}
.audio-bar{padding:12px 16px;border-top:1px solid var(--border);background:var(--white);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.audio-source{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-sm);background:var(--stone-100);border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all var(--t-fast);}
.audio-source.active{background:var(--sage-light);border-color:var(--sage-border);color:var(--sage);}
.audio-source .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.btn-start-listen{flex:1;padding:9px;border-radius:var(--r-sm);background:var(--sage);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:background var(--t-fast);display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-start-listen:hover{background:var(--sage-mid);}
.btn-stop-listen{flex:1;padding:9px;border-radius:var(--r-sm);background:var(--red-bg);border:1px solid rgba(185,28,28,.25);color:var(--red);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:all var(--t-fast);display:none;align-items:center;justify-content:center;gap:7px;}
.btn-stop-listen:hover{background:rgba(185,28,28,.10);}
.suggestions-zone{padding:14px 20px;border-top:1px solid var(--border);background:var(--white);flex-shrink:0;}
.suggestions-label{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.suggestions-age{font-size:10px;color:var(--muted-2);font-weight:500;text-transform:none;letter-spacing:0;}
.suggestion-pills{display:flex;flex-direction:column;gap:7px;}
.suggestion-pill{padding:10px 14px;background:var(--stone-50);border:1px solid var(--border);border-radius:var(--r-md);font-size:13px;color:var(--ink-2);cursor:pointer;text-align:left;transition:all var(--t-fast);line-height:1.5;}
.suggestion-pill:hover{background:var(--sage-light);border-color:var(--sage-border);color:var(--ink);}
.suggestion-pill .pill-tag{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;color:var(--sage);display:block;margin-bottom:3px;letter-spacing:.06em;}
.suggestion-pill.ear{background:var(--sage-light);border-color:var(--sage-border);}
.new-territory{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--amber);margin-bottom:10px;}
.new-territory.visible{display:flex;}
.col-right{background:var(--white);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.script-zone{flex:1;overflow-y:auto;}
.script-block{padding:14px 16px;border-bottom:1px solid var(--border);transition:background var(--t-mid),border-left var(--t-mid);}
.script-block.current{background:var(--sage-light);border-left:3px solid var(--sage);}
.script-block-tag{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
.script-block.current .script-block-tag{color:var(--sage);}
.script-block-text{font-size:13px;color:var(--ink-2);line-height:1.6;}
.script-block.current .script-block-text{color:var(--ink);}
.challenger-zone{flex:1;display:none;}
.challenger-zone.active{display:flex;flex-direction:column;}
.challenger-angles{padding:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0;}
.challenger-angle-mini{padding:9px;background:var(--stone-50);border:1.5px solid var(--border-2);border-radius:var(--r-sm);cursor:pointer;transition:all var(--t-fast);}
.challenger-angle-mini:hover{border-color:var(--sage-border);background:var(--sage-light);}
.challenger-angle-mini.selected{border-color:var(--sage);background:var(--sage-light);}
.cam-label{font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
.challenger-angle-mini.selected .cam-label{color:var(--sage);}
.cam-title{font-size:12px;font-weight:600;margin-top:3px;color:var(--ink);line-height:1.3;}
.challenger-sequence{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.challenger-step{padding:13px 15px;background:var(--stone-50);border:1.5px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all var(--t-fast);}
.challenger-step:hover{border-color:var(--sage-border);background:var(--sage-light);}
.challenger-step.expanded{border-color:var(--sage);background:var(--sage-light);}
.cstep-header{display:flex;align-items:center;gap:10px;}
.cstep-num{width:22px;height:22px;border-radius:50%;background:var(--stone-200);display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;color:var(--muted);flex-shrink:0;}
.challenger-step.expanded .cstep-num{background:var(--sage);color:#fff;}
.cstep-title{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em;}
.cstep-preview{font-size:12px;color:var(--muted);margin-top:3px;}
.cstep-script{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--sage-border);font-size:13px;color:var(--ink);line-height:1.65;}
.challenger-step.expanded .cstep-script{display:block;}
#view-debrief{flex-direction:column;}
.debrief-body{flex:1;padding:32px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start;max-width:1200px;margin:0 auto;width:100%;}
.modal-overlay{position:fixed;inset:0;background:rgba(24,24,27,.35);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);padding:20px;}
.modal-overlay.open{display:flex;animation:fadeIn .15s var(--ease);}
.modal{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);width:600px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg);animation:modalIn .2s var(--ease);}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
.modal-close{width:30px;height:30px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;transition:all var(--t-fast);}
.modal-close:hover{background:var(--stone-100);color:var(--ink);}
.modal-body{flex:1;padding:22px 24px;overflow-y:auto;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}
#modal-keys .modal{width:480px;}
#modal-keys .modal-body{padding:24px;}
.keys-field{margin-bottom:16px;}
.keys-field:last-of-type{margin-bottom:8px;}
.keys-link{display:block;margin-top:16px;font-size:11px;color:var(--muted-2);text-align:center;cursor:pointer;text-decoration:underline;}
.keys-link:hover{color:var(--sage);}
.toast-stack{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{padding:11px 18px;background:var(--ink);color:#fff;border-radius:var(--r-md);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);pointer-events:auto;display:flex;align-items:center;gap:9px;animation:toastIn .22s var(--ease);max-width:400px;}
.toast.error{background:var(--red);}
.toast.success{background:var(--sage);}
.toast.warning{background:var(--amber);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
.toast-icon{font-size:15px;}
.auth-overlay{position:fixed;inset:0;background:var(--stone-50);z-index:1500;display:none;align-items:center;justify-content:center;padding:20px;}
.auth-overlay.visible{display:flex;}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px;max-width:400px;text-align:center;box-shadow:var(--shadow-md);}
.auth-card h2{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;margin-bottom:10px;color:var(--ink);}
.auth-card p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
.auth-card a{display:inline-block;padding:10px 20px;background:var(--sage);color:#fff;border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;text-decoration:none;transition:background var(--t-fast);}
.auth-card a:hover{background:var(--sage-mid);}
.debrief-overlay{position:fixed;inset:0;background:rgba(24,24,27,.55);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;}
.debrief-overlay.visible{display:flex;}
.debrief-card{background:var(--white);border-radius:var(--r-lg);padding:32px;max-width:400px;text-align:center;box-shadow:var(--shadow-lg);}
.debrief-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--sage);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
.debrief-title{font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;margin-bottom:8px;color:var(--ink);}
.debrief-sub{font-size:13px;color:var(--muted);line-height:1.6;}
@media(max-width:1100px){
  .live-body{grid-template-columns:260px 1fr 300px;}
  .detail-body{grid-template-columns:1fr;}
  .sequence-selector{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:900px){
  .live-body{grid-template-columns:1fr;}
  .col-left,.col-right{display:none;}
  .angles-grid{grid-template-columns:1fr;}
  .w-fields{grid-template-columns:1fr;}
  .debrief-body{grid-template-columns:1fr;}
  .rdv-history-panel{display:none;}
  .prospects-list-panel{width:260px;}
  .sequence-selector{grid-template-columns:1fr 1fr;}
}
@media(max-width:640px){
  .prospects-list-panel{width:100%;position:absolute;inset:56px 0 0 0;z-index:10;}
  .sequence-selector{grid-template-columns:1fr;}
}
</style>
